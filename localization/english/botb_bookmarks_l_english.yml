l_english:
    bm_1178_botb: "Baptism of the Balts"
    bm_1178_botb_desc: "The Baltic region is one of the last bastions of paganism in Europe. However, the idyllic peace of the Kriwe and his vaidila subordinates is coming to an end - a wave of zealous believers is coming from the west and the east to preach their God Jesus. #bold Only time will tell whether the old ways or the new will triumph... #!"

    #Jarl Haesteinn
    bookmark_botb_algimantas:0 "High Chieftain Algimantas"
    bookmark_botb_algimantas_subheading: "$BOOKMARK_SUBHEADING_HIGH_CHIEFTAIN$"
    bookmark_botb_algimantas_desc:0 "According to legend, once upon a time a ship sailed out from Pontus, filled with roman nobles fleeing the terror of a cruel emperor. Now, more than a millenium later, the descendants of one of these nobles - Palemon - rule a significant part of Lithuania.\nAlthough he does not speak a single word of latin, worships Perkūnas and looks just like any other Lithuanian, $bookmark_botb_algimantas$ considers himself worthy of Palemon's legacy - and only time will tell if he is right.\n\n#bold Will the bloodline of Palemon survive the wind of changes? #!"