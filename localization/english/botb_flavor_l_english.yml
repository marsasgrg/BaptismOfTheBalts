l_english:
    baltic_flavor.0001.title_male: "A Captivating Vaidila"
    baltic_flavor.0001.title_female: "A Captivating Vaidilutė"
    baltic_flavor.0001.desc_female: "As I stroll through [event_province.GetName()], I spot a maiden most fair. It turns out she is [birute.GetName()], a priestess devoted to the beliefs of [ROOT.Char.GetFaith.GetName]. Yet, despite such a role, she acts rather flirtatiously..."
    baltic_flavor.0001.desc_male: "As I stroll through [event_province.GetName()], I spot a man most fair. It turns out he is [birute.GetName()], a priest devoted to the beliefs of [ROOT.Char.GetFaith.GetName]. Yet, despite such a role, he acts rather flirtatiously..."
    baltic_flavor.0001.a: "I am sure [ROOT.Char.GetFaith().HighGodName] will forgive me..."
    baltic_flavor.0001.b: "I musn't risk the wrath of [ROOT.Char.GetFaith().HighGodName]."
    
    baltic_flavor.0002.title: "An Unholy Dalliance"
    baltic_flavor.0002.desc_female: "It turns out [birute.GetName()] was not as dedicated to her faith as I thought she would be. Needless to say, the following events were quite enjoyable, and left both us desiring more. However, now, having desecrated a priestess of [ROOT.Char.GetFaith().HighGodName], I am left with a question - what do I do now?"
    baltic_flavor.0002.desc_male: "It turns out [birute.GetName()] was not as dedicated to his faith as I thought he would be. Needless to say, the following events were quite enjoyable. However, now, having desecrated a priestess of [ROOT.Char.GetFaith().HighGodName], I am left with a question - what do I do now?"
    baltic_flavor.0002.a: "I will take [birute.GetHerHim] as my spouse, [ROOT.Char.GetFaith().GetName()] be damned!"
    baltic_flavor.0002.b: "I will take [birute.GetHerHim] as my concubine, [ROOT.Char.GetFaith().GetName()] be damned!"
    baltic_flavor.0002.c: "In secret, [birute.GetSheHe] will come with me to my court."
    baltic_flavor.0002.d: "This was only a side activity."
    
    baltic_flavor.0011.title:0 "The Teachings of [bruno.GetName()]"
    baltic_flavor.0011.desc:0 "A priest of [bruno.GetFaith().GetName()] named [bruno.GetName()] has arrived in [spawn_county.GetShortName()]. He barged into my court room, speaking about his faith, inviting me to convert to it. He survived walking through fire, and hopes this will convince me of the truth of his beliefs."
    baltic_flavor.0011.a:0 "His words are true!"
    baltic_flavor.0011.b:0 "\"Go elsewhere - maybe some fool will believe you\""
    baltic_flavor.0011.c:0 "\"Will no one rid me of this turbulent priest?\""

    baltic_flavor.0013.title:0 "The Martyrdom of [bruno.GetName()]"
    baltic_flavor.0013.desc:0 "I am met with unfortunate news - it turns out [bruno.GetName()], the man who taught me the wonder of [bruno.GetFaith().GetName()], has been martyred by bandits in [bruno_murder_territory.GetName()]."
    baltic_flavor.0013.a:0 "It's sad that this happened, but what can I do?"
    
    baltic_flavor.0014.title:0 "Priest of [bruno.GetFaith().GetName()] Murdered in My Land"
    baltic_flavor.0014.desc:0 "I have received news that a fervent believer of [bruno.GetFaith().GetName()], [bruno.GetName()], has been murdered in my lands, within [bruno_murder_territory.GetName()]. He was hit on the head by a pagan's club,"
    baltic_flavor.0014.a:0 "Disgusting pagans!"
    baltic_flavor.0014.b:0 "Whatever."
