l_english:
    baltic_flavor.0001.title_male_baltic: "A Captivating Vaidila"
    baltic_flavor.0001.title_female_baltic: "A Captivating Vaidilutė"
    baltic_flavor.0001.title_finnic: "A Captivating Noaidi"
    baltic_flavor.0001.desc_female: "As I stroll through [event_province.GetName()], I spot a maiden most fair. It turns out she is [birute.GetName()], a priestess devoted to the beliefs of [ROOT.Char.GetFaith.GetName]. Yet, despite such a role, she acts rather flirtatiously..."
    baltic_flavor.0001.desc_male: "As I stroll through [event_province.GetName()], I spot a man most fair. It turns out he is [birute.GetName()], a priest devoted to the beliefs of [ROOT.Char.GetFaith.GetName]. Yet, despite such a role, he acts rather flirtatiously..."
    baltic_flavor.0001.a: "I am sure [ROOT.Char.GetFaith().HighGodName] will forgive me..."
    baltic_flavor.0001.b: "I musn't risk the wrath of [ROOT.Char.GetFaith().HighGodName]."
    
    baltic_flavor.0002.title: "An Unholy Dalliance"
    baltic_flavor.0002.desc_female: "It turns out [birute.GetName()] was not as dedicated to her faith as I thought she would be. Needless to say, the following events were quite enjoyable, and left both us desiring more. However, now, having desecrated a priestess of [ROOT.Char.GetFaith().HighGodName], I am left with a question - what do I do now?"
    baltic_flavor.0002.desc_male: "It turns out [birute.GetName()] was not as dedicated to his faith as I thought he would be. Needless to say, the following events were quite enjoyable. However, now, having desecrated a priestess of [ROOT.Char.GetFaith().HighGodName], I am left with a question - what do I do now?"
    baltic_flavor.0002.a: "I will take [birute.GetHerHim] as my spouse, [ROOT.Char.GetFaith().GetName()] be damned!"
    baltic_flavor.0002.b: "I will take [birute.GetHerHim] as my concubine, [ROOT.Char.GetFaith().GetName()] be damned!"
    baltic_flavor.0002.c: "In secret, [birute.GetSheHe] will come with me to my court."
    baltic_flavor.0002.d: "This was only a side activity."
    
    baltic_flavor.0011.title:0 "The Teachings of [bruno.GetName()]"
    baltic_flavor.0011.desc:0 "A priest of [bruno.GetFaith().GetName()] named [bruno.GetName()] has arrived in [spawn_county.GetNameNoTier()]. He barged into my court room, speaking about his faith, inviting me to convert to it. He survived walking through fire, and hopes this will convince me of the truth of his beliefs."
    baltic_flavor.0011.a:0 "His words are true!"
    baltic_flavor.0011.b:0 "\"Go elsewhere - maybe some fool will believe you\""
    baltic_flavor.0011.c:0 "\"Will no one rid me of this turbulent priest?\""

    baltic_flavor.0013.title:0 "The Martyrdom of [bruno.GetName()]"
    baltic_flavor.0013.desc:0 "I am met with unfortunate news - it turns out [bruno.GetName()], the man who taught me the wonder of [bruno.GetFaith().GetName()], has been martyred by bandits in [bruno_murder_territory.GetNameNoTier()]."
    baltic_flavor.0013.a:0 "It's sad that this happened, but what can I do?"
    
    baltic_flavor.0014.title:0 "Priest of [bruno.GetFaith().GetName()] Murdered in My Land"
    baltic_flavor.0014.desc:0 "I have received news that a fervent believer of [bruno.GetFaith().GetName()], [bruno.GetName()], has been murdered in my realm, in [bruno_murder_territory.GetNameNoTier()]. He was hit on the head by a pagan's club alongside many of his followers."
    baltic_flavor.0014.a:0 "Disgusting pagans!"
    baltic_flavor.0014.b:0 "Whatever."

    baltic_flavor.0021.title:0 "[purchase_offer.GetFaith().GetAdherentNamePlural()] Want to Settle [county_to_purchase.GetNameNoTier()]"
    baltic_flavor.0021.desc:0 "[purchase_offer.GetCulture().GetName()] believers in [purchase_offer.GetFaith().GetName()] have come to me, asking to buy [county_to_purchase.GetNameNoTier()]. They claim that once they acquire this piece of my land, they will settle it with people from their homeland, as well as convert the locals to their beliefs. They offer a quite sizable sum - @gold_icon!#P 250#!."
    baltic_flavor.0021.a:0 "Wow, that's a great deal!"
    baltic_flavor.0021.b:0 "I will not give up this ancestral land to these people."

    baltic_flavor.0031.t:0 "[potential_gainable_title.GetNameNoTier()] for Baptism"
    baltic_flavor.0031.desc:0 "My advisors have spotted an opportunity - the realm of [potential_gainable_title.GetNameNoTier()] is led by a young ruler dependent on a regent. [jadwiga.GetHerHis()|U] name is [jadwiga.GetFullName()], while the regent is [evil_diarch.GetFullName()]. We believe the regent would be willing to, for a sum of gold and our conversion to [jadwiga.GetFaith().GetName()], force [jadwiga.GetName()] to marry us, thus destining the entire  [potential_gainable_title.GetName()] for our control - see, [jadwiga.GetName()] is childless."
    baltic_flavor.0031.a:0 "This will bring me power!"
    baltic_flavor.0031.b:0 "I will not betray my faith from greed!"
    baltic_flavor.0031.will_send_offer:0 "An offer will be sent to [evil_diarch.GetName()]"